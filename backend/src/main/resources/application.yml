spring:
  profiles:
    default: dev
    group:
      dev: mysql
      prod: mysql
      preview: mysql
  application:
    name: personal-economy-backend
  jackson:
    time-zone: UTC
  flyway:
    enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

personal-economy:
  data-file: ${PE_DATA_FILE:data/workspace.json}
  local-user-id: ${PE_LOCAL_USER_ID:local-review-user}
